spring:
  application:
    name: livros-service
  profiles:
    active: prod
  config:
    import: 'vault://, configserver:http://config-server:8888'
  cloud:
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      uri: ${VAULT_SCHEME:http}://${VAULT_HOST:localhost}:${VAULT_PORT:8200}
      token: ${VAULT_TOKEN}
      generic:
        enabled: true
        application-name: livros-service
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASS:o5qByEjgPOwh3yXOqf}
  boot:
    admin:
      client:
        url: ${monitoramentoHost}
        username: ${monitoramentoUser}
        password: ${monitoramentoPass}
        instance:
          metadata:
            user:
              name: ${actuatorUser}
              password: ${actuatorPass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

---
# Local: a busca automática de capas fica só em produção (ver TarefaCapas).
spring:
  config:
    activate:
      on-profile: dev
livros:
  capas:
    tarefa-ativa: false
